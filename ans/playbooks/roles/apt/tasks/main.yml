- name: Install nginx
  apt:
   name: 
   - nginx
   state: latest

- name: Install Python
  apt:
   name: 
   - python3
   - python3-pip
   - python3-venv
   - gunicorn
   - python3-psycopg2
   state: latest

- name: Install Postgres
  apt:
   name: 
   - postgresql
   - postgresql-contrib
   - libpq-dev
   state: latest

