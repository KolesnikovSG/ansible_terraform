---

- name: Copy backend files to server
  copy:
    src: files/Todo-back-main/  
    dest: /opt/
    owner: root
    group: root
    mode: 0755

- name: Install Python dependencies
  pip:
    requirements: /opt/todo-backend/requirements.txt
    executable: pip3

