---    

- name: Установить системные зависимости для psycopg2
  apt:
    name:
      - python3-dev
      - libpq-dev
      - postgresql-client
    state: present
    update_cache: yes
  become: yes
  
- name: Install PostgreSQL
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create PostgreSQL user
  postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    state: present

- name: Create database
  postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"
    state: present
